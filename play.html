<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Палата 404</title>
<link rel="stylesheet" href="landscape-shell.css?v=146b54c7920c">
<script src="profile-session.js?v=4cc9140077a6" defer></script>
<script src="landscape-shell.js?v=8ad04f07ec71" defer></script>
</head>
<body>
<main id="landscape-screen" aria-label="Палата 404">
  <div id="canvas-slot"><iframe id="game-canvas" title="Палата 404 — игра" allow="fullscreen" scrolling="no"></iframe></div>
</main>
<section id="profile-session-notice" role="status" aria-live="polite" aria-labelledby="profile-session-title">
  <img src="assets/ui/wardrobe/requested-header-emblem.webp" alt="Эмблема учреждения" width="48" height="56">
  <h1 id="profile-session-title">Загрузка сохранения</h1>
  <p id="profile-session-message">Проверяем, что игра не открыта в другой вкладке.</p>
  <button id="profile-session-reload" type="button" hidden>Загрузить игру</button>
</section>
<section id="rotate-prompt" role="status" aria-live="polite" hidden>
  <div aria-hidden="true" class="rotate-icon">↻</div>
  <h1>Поверните телефон горизонтально</h1>
  <p>Игра сохраняет широкую композицию на всех экранах.</p>
</section>
<button id="fullscreen-button" type="button" aria-label="На весь экран" title="На весь экран">⛶</button>
<p id="fullscreen-note" role="status" hidden>Полноэкранный режим недоступен в этом браузере.</p>
</body>
</html>
