<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Палата 404</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>

    <header class="top-bar">
        <div class="user-info">
            <span id="player-name">Пацієнт #404</span>
        </div>
        <div class="currency">
            <span>💊 <strong id="pills">0</strong></span>
            <span>📦 <strong id="scrap">0</strong></span>
        </div>
    </header>

    <main class="game-container">
        
        <!-- Ліва панель статистики -->
        <aside class="stats-panel">
            <div class="stat-group">
                <label>❤ Здоров'я: <span id="hp-val">100 / 100 HP</span></label>
                <div class="bar-bg"><div class="bar-fill hp" id="hp-bar" style="width: 100%;"></div></div>
            </div>

            <div class="stat-group">
                <label>🛡 Броня: <span id="armor-val">0</span></label>
            </div>

            <div class="stat-group">
                <label>⚔ Шкода: <span id="dmg-val">10</span></label>
            </div>

            <div class="stat-group">
                <label>🌀 Божевілля: <span id="madness-val">20%</span></label>
                <div class="bar-bg"><div class="bar-fill madness" id="madness-bar" style="width: 20%;"></div></div>
            </div>

            <div class="stat-group">
                <label>⚡ Енергія: <span id="energy-val">80/100</span></label>
                <div class="bar-bg"><div class="bar-fill energy" id="energy-bar" style="width: 80%;"></div></div>
            </div>

            <hr class="divider">

            <!-- Кнопки дій -->
            <button class="btn-side" onclick="openInventory()">🎒 Сховище (Military)</button>
            <button class="btn-side" onclick="openCustomization()">🪞 Дзеркало (Стиль)</button>
            <button class="btn-side" onclick="restInBed()">🛏 Поспати (+⚡ / -🌀)</button>
        </aside>

        <!-- Центральна кімната -->
        <section class="room-view">
            <div class="character-container" onclick="tapCharacter()">
                <div class="character-avatar" id="character">🧑‍🦯</div>
                <div class="character-outfit" id="outfit-icon">🩺</div>
            </div>
            
            <button class="btn-action" onclick="tapCharacter()">Дослідити палату</button>
        </section>

    </main>

    <!-- Модальне вікно Інвентарю / Сховища -->
    <div id="inventory-modal" class="modal hidden">
        <div class="modal-content large">
            <h3>🎒 Сховище та Характеристики</h3>
            
            <div class="stats-summary" style="margin-bottom: 10px; font-size: 13px; color: #ddd; background: #222; padding: 8px; border-radius: 6px;">
                <div>⚔ Шкода зброї: <strong id="modal-dmg">10</strong></div>
                <div>🛡 Загальна Броня: <strong id="modal-armor">0</strong></div>
                <div>❤ Макс. HP: <strong id="modal-max-hp">100 HP</strong></div>
            </div>

            <div class="equipment-grid">
                <div class="equip-slot">🪖 Шолом: <span id="slot-helmet">Порожньо</span></div>
                <div class="equip-slot">🥼 Бронік: <span id="slot-armor">Порожньо</span></div>
                <div class="equip-slot">🔫 Зброя: <span id="slot-weapon">Ніж (Базовий)</span></div>
                <div class="equip-slot">🔦 Обвіс: <span id="slot-attachment">Без обвісу</span></div>
            </div>

            <hr class="divider">
            <h4>📦 Предмети у сховищі:</h4>
            <div id="stash-items" class="stash-list">
                <!-- Вміст сховища -->
            </div>

            <button class="btn-close" onclick="closeInventory()">Закрити</button>
        </div>
    </div>

    <!-- Модальне вікно кастомізації -->
    <div id="custom-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Гардероб Палати</h3>
            <div class="outfit-options">
                <button onclick="setOutfit('🩺', 'Рваха халат', 0)">🩺 Стандартний халат</button>
                <button onclick="setOutfit('🥼', 'Смикальна сорочка', 10)">🥼 Смикальна сорочка (10💊)</button>
                <button onclick="setOutfit('🥷', 'Маска тріщини', 25)">🥷 Маска тріщини (25💊)</button>
            </div>
            <button class="btn-close" onclick="closeCustomization()">Закрити</button>
        </div>
    </div>

    <script src="script.js?v=12"></script>
</body>
</html>
