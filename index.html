<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Палата 404</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=9500">
</head>
<body>

    <!-- Верхня панель з профілем, рівнем, досвідом і званням -->
    <div class="top-nav">
        <div class="user-profile-badge" onclick="changeNickname()">
            <div class="avatar-mini">🪖</div>
            <div class="user-text">
                <div class="user-name-row">
                    <strong id="player-name">Завантаження...</strong>
                    <span class="rank-tag" id="player-rank">Новачок</span>
                </div>
                
                <!-- Рівень та Смужка досвіду -->
                <div class="exp-container">
                    <div class="exp-label">
                        <span>Рівень <strong id="player-lvl">1</strong></span>
                        <span id="exp-val">0 / 100 EXP</span>
                    </div>
                    <div class="exp-bar-bg">
                        <div class="exp-fill" id="exp-bar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="compass">W . . NW . . <span>N</span> . . NE . . E</div>

        <div class="top-actions">
            <span>🔔</span>
            <span>✉️</span>
            <span>⚙️</span>
        </div>
    </div>

    <!-- Основна ігрова сітка -->
    <main class="main-layout">
        
        <!-- Ліва панель: Стати та Меню (БЕЗ ГАРЯЧИХ КЛАВІШ) -->
        <aside class="left-panel">
            <div class="vitals-group">
                <div class="vital-item">
                    <div class="vital-icon hp-icon">❤️</div>
                    <div class="vital-info">
                        <div class="vital-label">HP (Здоров'я) <span id="hp-val">100 / 100</span></div>
                        <div class="bar-bg"><div class="bar-fill hp" id="hp-bar" style="width: 100%;"></div></div>
                    </div>
                </div>

                <div class="vital-item">
                    <div class="vital-icon madness-icon">🧠</div>
                    <div class="vital-info">
                        <div class="vital-label">Божевілля <span id="madness-val">0 / 100</span></div>
                        <div class="bar-bg"><div class="bar-fill madness" id="madness-bar" style="width: 0%;"></div></div>
                    </div>
                </div>

                <div class="vital-item">
                    <div class="vital-icon energy-icon">⚡</div>
                    <div class="vital-info">
                        <div class="vital-label">Витривалість <span id="energy-val">100 / 100</span></div>
                        <div class="bar-bg"><div class="bar-fill energy" id="energy-bar" style="width: 100%;"></div></div>
                    </div>
                </div>
            </div>

            <nav class="side-menu">
                <button class="menu-btn" onclick="openInventory()">🎒 Інвентар</button>
                <button class="menu-btn" onclick="openInventory()">📦 Сховище</button>
                <button class="menu-btn" onclick="openCustomization()">👕 Гардероб</button>
                <button class="menu-btn" onclick="alert('Карта в розробці')">🗺️ Карта</button>
                <button class="menu-btn" onclick="alert('Завдання в розробці')">📋 Завдання</button>
            </nav>
        </aside>

        <!-- Центр: Персонаж та дія -->
        <section class="center-stage">
            <div class="character-preview" onclick="tapCharacter()">
                <div class="hero-avatar" id="character">🥷</div>
            </div>
            <button class="btn-main-action" onclick="tapCharacter()">🔍 Дослідити руїни (+EXP)</button>
        </section>

        <!-- Права панель -->
        <aside class="right-panel">
            <div class="location-card">
                <div class="loc-title">Поточна локація</div>
                <div class="loc-name">Зруйноване місто</div>
                <div class="loc-desc">Ти не один тут...</div>
            </div>

            <nav class="side-menu">
                <button class="menu-btn" onclick="restInBed()">🔧 Відпочинок (+⚡ / -🧠)</button>
                <button class="menu-btn" onclick="changeNickname()">👤 Змінити ім'я</button>
                <button class="menu-btn" onclick="alert('Друзі незабаром')">👥 Друзі</button>
            </nav>
        </aside>

    </main>

    <!-- Нижня панель швидкого доступу -->
    <footer class="hotbar">
        <div class="slot active"><span>1</span> 🔫</div>
        <div class="slot"><span>2</span> 🔪</div>
        <div class="slot"><span>3</span> 🧪</div>
        <div class="slot"><span>4</span></div>
        <div class="slot"><span>5</span></div>
    </footer>

    <!-- Модальні вікна -->
    <div id="inventory-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🎒 Інвентар</h3>
            <div id="stash-items" class="stash-list"></div>
            <button class="btn-close" onclick="closeInventory()">Закрити</button>
        </div>
    </div>

    <div id="custom-modal" class="modal hidden">
        <div class="modal-content">
            <h3>👕 Гардероб</h3>
            <div id="wardrobe-container" class="wardrobe-grid"></div>
            <button class="btn-close" onclick="closeCustomization()">Закрити</button>
        </div>
    </div>

    <script src="script.js?v=9500"></script>
</body>
</html>
