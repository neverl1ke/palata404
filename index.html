<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Палата 404</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Додаємо ?v=2, щоб збити кеш Telegram -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <header class="top-bar">
        <div class="user-info">
            <span id="player-name">Пацієнт #404</span>
        </div>
        <div class="currency">
            <span>💊 <strong id="pills">0</strong></span>
        </div>
    </header>

    <main class="game-container">
        
        <aside class="stats-panel">
            <div class="stat-group">
                <label>❤ Здоров'я</label>
                <div class="bar-bg"><div class="bar-fill hp" id="hp-bar" style="width: 100%;"></div></div>
            </div>

            <div class="stat-group">
                <label>🌀 Божевілля</label>
                <div class="bar-bg"><div class="bar-fill madness" id="madness-bar" style="width: 20%;"></div></div>
            </div>

            <div class="stat-group">
                <label>⚡ Енергія</label>
                <div class="bar-bg"><div class="bar-fill energy" id="energy-bar" style="width: 80%;"></div></div>
            </div>
        </aside>

        <section class="room-view">
            <div class="character-container">
                <div class="character-avatar" id="character">
                    🧑‍🦯
                </div>
            </div>
            
            <button class="btn-action" onclick="tapCharacter()">Дослідити палату</button>
        </section>

    </main>

    <!-- Додаємо ?v=2 сюди також -->
    <script src="script.js?v=2"></script>
</body>
</html>
