<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Палата 404 — нативні кадри</title><style>body{font:16px system-ui;background:#182026;color:#eee;max-width:1100px;margin:auto;padding:16px}input[type=range]{width:100%}canvas{display:block;width:min(100%,941px);height:auto}button,select,input{font:inherit;padding:8px}#stage{background:#777;overflow:auto}p{line-height:1.5}</style><h1>Нативні кадри Avatar Core</h1><p>Виберіть файл <b>.avframes</b> з папки <b>Gallery/Dense</b>. Це 241 точний RGBA-кадр, з кроком 1/60 секунди, включно з 0 і 4000 мс. Перегляд не є вимірюванням FPS гри.</p><input type="file" id="file" accept=".avframes"><p id="status">Файл ще не вибрано</p><input id="position" type="range" min="0" max="240" value="0" disabled><button id="prev">Попередній</button> <button id="next">Наступний</button> <button id="save">Завантажити PNG</button> <select id="background"><option value="#777">Сірий</option><option value="#fff">Білий</option><option value="#000">Чорний</option><option value="#00ff00">Зелений</option><option value="transparent">Прозорий</option></select><div id="stage"><canvas id="frame" width="941" height="1672"></canvas></div><script>
const $=id=>document.getElementById(id);let blob,header,start,cache=new Map(),token=0,current=0;const canvas=$('frame'),ctx=canvas.getContext('2d');
async function show(index){if(!header)return;const id=++token;index=Math.max(0,Math.min(240,index));$('status').textContent='Декодування кадру '+index;let nearest=-1;for(const k of cache.keys())if(k<=index&&k>nearest)nearest=k;let bytes=nearest<0?new Uint8Array(canvas.width*canvas.height*4):cache.get(nearest).slice();const words=new Uint32Array(bytes.buffer);
for(let i=nearest+1;i<=index;i++){if(id!==token)return;const row=header.frames[i];const stream=blob.slice(start+row.offset,start+row.offset+row.bytes).stream().pipeThrough(new DecompressionStream('deflate'));const delta=new Uint32Array(await new Response(stream).arrayBuffer());if(delta.length!==words.length)throw Error('Некоректний розмір кадру');for(let j=0;j<words.length;j++)words[j]^=delta[j];if(i%60===0)cache.set(i,bytes.slice());if(i%8===0)await new Promise(r=>setTimeout(r,0));}
if(id!==token)return;const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');if(digest!==header.frames[index].rgba_sha256)throw Error('Не збігається SHA-256');ctx.putImageData(new ImageData(new Uint8ClampedArray(bytes.buffer),canvas.width,canvas.height),0,0);current=index;$('position').value=index;$('status').textContent=`Кадр ${index}/240 · ${header.frames[index].time_ms.toFixed(3)} мс · SHA-256 перевірено · ${canvas.width}×${canvas.height}`;}
function safe(p){p.catch(e=>$('status').textContent='Помилка: '+e.message)}
$('file').onchange=async()=>{blob=$('file').files[0];if(!blob)return;try{const lead=await blob.slice(0,11).arrayBuffer();if(new TextDecoder().decode(lead.slice(0,7))!=='P404F1\n')throw Error('Невідомий формат');const n=new DataView(lead).getUint32(7,true);header=JSON.parse(await blob.slice(11,11+n).text());if(header.frames.length!==241)throw Error('Неповний цикл');start=11+n;[canvas.width,canvas.height]=header.size;cache.clear();$('position').disabled=false;await show(0)}catch(e){$('status').textContent='Помилка: '+e.message}};
$('position').oninput=()=>safe(show(+$('position').value));$('prev').onclick=()=>safe(show(current-1));$('next').onclick=()=>safe(show(current+1));$('background').onchange=()=>{$('stage').style.background=$('background').value};$('save').onclick=()=>{if(!header)return;const a=document.createElement('a');a.download=`frame-${String(current).padStart(4,'0')}.png`;a.href=canvas.toDataURL();a.click()};
</script></html>
