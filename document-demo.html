<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Палата 404 — Documents</title><link rel="stylesheet" href="typewriter.css"><link rel="stylesheet" href="document-system.css"><style>
*{box-sizing:border-box}body{margin:0;background:#141612;color:#e3d2b3;font:16px/1.5 'Palata Typewriter',monospace}main{padding:24px;max-width:1400px;margin:auto}h1{font-size:24px;font-weight:normal}a{color:#dfc496}.demo-controls{display:flex;gap:14px;flex-wrap:wrap;padding:16px;border:1px solid #886b46;background:#25251e;position:relative;z-index:2}.demo-controls label{display:grid;gap:4px;font-size:13px}.demo-controls select,.demo-controls input{background:#d5bd91;color:#2d2116;border:1px solid #896a42;padding:8px;font:inherit;max-width:100%}.demo-controls input{min-width:260px}.demo-grid{display:grid;gap:24px;justify-items:center;margin:24px 0}.demo-specimen{width:min(var(--demo-width,960px),100%);max-width:100%;padding:0;--paper-edge:30px}.demo-specimen.document-only{padding:24px 28px;}.demo-specimen p{margin:12px 0}.demo-body{padding:10px 4px 24px}.demo-body h2{font-weight:normal;font-size:22px}.demo-body p{max-width:65ch}.demo-foot{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid #6d4b2b;padding-top:18px}.demo-foot document-stamp{font-size:15px}.demo-note{font-size:13px;max-width:70ch}#demo-error{color:#ebae87}.hidden{display:none!important}@media(max-width:600px){main{padding:10px}.demo-controls input{min-width:0;width:100%}.demo-controls label:has(input){width:100%}.demo-specimen{--paper-edge:20px}.demo-specimen.document-only{padding:20px}.demo-foot{flex-wrap:wrap}.demo-body{font-size:14px}}
</style><script src="localization.js" defer></script><script src="document-system.js" defer></script><script src="document-demo.js" defer></script></head><body><main><h1>Палата 404 · Document system</h1><p class="demo-note">HEADER-LEFT / HEADER-CENTER · RU / UK / EN · live text · 9-slice. <a href="index.html">Гра / Game</a></p><form class="demo-controls" onsubmit="return false"><label>Language<select data-document-language><option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option></select></label><label>Header<select id="demo-variant"><option value="both">Both</option><option value="left">HEADER-LEFT</option><option value="center">HEADER-CENTER</option></select></label><label>Width<select id="demo-width"><option value="960">960 px</option><option value="640">640 px</option><option value="320">320 px</option></select></label><label>Department<select id="demo-department"><option value="documents.wardrobe">Wardrobe</option><option value="documents.weapons">Weapons</option><option value="documents.medical">Medical</option><option value="documents.staff">Personnel</option><option value="documents.postBattle">Post-battle</option></select></label><label>Custom department<input id="demo-custom-department" maxlength="180" placeholder="Назва відділу / Department"></label></form><div class="demo-grid"><document-paper class="demo-specimen" data-demo-variant="left"><document-header variant="left" department="documents.wardrobe"></document-header></document-paper><document-paper class="demo-specimen" data-demo-variant="center"><document-header variant="center" department="documents.wardrobe" stamps></document-header></document-paper><document-layout class="demo-specimen document-only" data-demo-variant="layout"><document-header variant="center" department="documents.medical" document-type="documents.protocol"></document-header><section class="demo-body"><h2 data-i18n="documents.demoTitle"></h2><p data-i18n="documents.demoBody"></p><p>№ 404 / 001 · 06.11.2026</p><footer class="demo-foot"><document-stamp type="service" rotate="-7"></document-stamp><document-stamp type="seal" rotate="5"></document-stamp></footer></section></document-layout></div></main></body></html>
