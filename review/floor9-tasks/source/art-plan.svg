<title id="title">CONCEPT ONLY · 9 поверх · предметні стани завдань</title>
<desc id="desc">Технічна схема, не ігрові екрани. Чотири ізольовані набори по три стани: опора 909 без підтвердження проби; B-заявка та повторна перевірка без відкриття доступу; тримач 910; піднос із чашкою на полиці 911. Боси та кімнати 903, 906, 912 заморожені.</desc>
