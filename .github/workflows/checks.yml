name: Game checks
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q tools tests
      - run: python tools/audit-project.py --check
      - run: node --check script.js
      - run: node --check icons.js
      - run: node --check battle-results.js
      - run: node --check raid-archive.js
      - run: node --check staff-archive-data.js
      - run: node --check staff-archive.js
      - run: node --check paper-doll-data.js
      - run: node --check paper-doll.js
      - run: node --check female-hair-fit-data.js
      - run: node --check male-hair-fit-data.js
      - run: node --check male-hair-fit.js
      - run: node --check female-hair-fit.js
      - run: node --check hair-color.js
      - run: node --check wardrobe.js
      - run: node --check wardrobe-archive.js
      - run: node --check localization.js
      - run: node --check document-system.js
      - run: node --check document-demo.js
      - run: node --check weapon-system.js
      - run: node --check weapon-runtime.js
      - run: node --test --test-isolation=none tests/game-logic.test.cjs
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/avatar-core.test.mjs
      - run: python tools/run-python-tests.py --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore
